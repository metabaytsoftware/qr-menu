steps:
  # Build Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/qr-order-api:$SHORT_SHA
      - -t
      - gcr.io/$PROJECT_ID/qr-order-api:latest
      - -f
      - apps/qr-order-api/Dockerfile
      - .

  # Push to Container Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/qr-order-api:$SHORT_SHA

  # Deploy to Cloud Run
  - name: gcr.io/cloud-builders/gke-deploy
    args:
      - run
      - --filename=apps/qr-order-api/k8s/
      - --image=gcr.io/$PROJECT_ID/qr-order-api:$SHORT_SHA
      - --location=us-central1
    env:
      - CLOUDSDK_COMPUTE_ZONE=us-central1-a
      - CLOUDSDK_CONTAINER_CLUSTER=qr-menu-cluster

images:
  - gcr.io/$PROJECT_ID/qr-order-api:$SHORT_SHA
  - gcr.io/$PROJECT_ID/qr-order-api:latest

timeout: 3600s
options:
  machineType: N1_HIGHCPU_8
